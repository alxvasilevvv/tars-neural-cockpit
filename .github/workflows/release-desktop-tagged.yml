# Wave 72 — workflow boundary clarification.
# Wave 76 — release pipeline harden + Apple-secret graceful-degrade docs.
#
# This is the AUTHORITATIVE release pipeline for the v9.x desktop
# product (Tauri app + sidecar). Triggers automatically on every tag
# matching ``v*``. Builds .dmg / .app / .exe / .deb / .AppImage and
# publishes to the GitHub Release with the Tauri updater channel JSON.
#
# Sister workflow ``release-tagged.yml`` is the backend-tarball /
# Homebrew-tap pipeline. It is **manual-dispatch only** (``on:
# workflow_dispatch``) so it does NOT race with this one on tag push.
# Run it after ``release-desktop`` lands the dmg if you also need the
# CLI tarball + Homebrew tap bump.
#
# ─────────────────────────────────────────────────────────────────────
# Required GitHub Actions secrets (Settings → Secrets → Actions)
# ─────────────────────────────────────────────────────────────────────
#
# Tauri updater (REQUIRED for ``includeUpdaterJson: true`` to publish
# ``latest.json`` with a real signature; without these the dmg still
# builds but the in-app auto-updater can't verify it):
#
#   TAURI_SIGNING_PRIVATE_KEY            base64 of minisign private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   passphrase for the key
#
# Apple Developer notarization (OPTIONAL — when missing, the build
# falls back to ad-hoc codesigning so the .dmg still ships, just with
# the Gatekeeper "unidentified developer" warning that the install.sh
# xattr command already mitigates). Setting all four enables real
# notarized signing automatically via tauri-action's built-in path:
#
#   APPLE_CERTIFICATE                    base64-encoded .p12 cert
#   APPLE_CERTIFICATE_PASSWORD           .p12 export password
#   APPLE_SIGNING_IDENTITY               e.g. "Developer ID Application: …"
#   APPLE_ID                             Apple ID email for notarytool
#   APPLE_PASSWORD                       app-specific password (NOT the AppleID one)
#   APPLE_TEAM_ID                        10-char team ID from developer.apple.com
#
# Asset filenames produced (must match dl-proxy ALLOWED_FILENAMES at
# experiments/neural-showcase-v3/functions/dl/[file].ts):
#
#   TARS_<version>_aarch64.dmg           macOS arm64
#   TARS_<version>_x64.dmg               macOS Intel (best-effort)
#   TARS_aarch64.app.tar.gz              Tauri updater app bundle (arm64)
#   latest.json                          Tauri updater channel manifest
#
# Note: Tauri 2.x embeds the minisign signature INSIDE latest.json
# (no separate latest.json.sig file is emitted). The dl-proxy allowlist
# entry for ``latest.json.sig`` is harmless — Tauri updater client never
# requests it.
name: release-desktop

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
            optional: false
          # macos-13 (Intel) runners have been chronically queue-starved
          # on the GitHub free plan since Apple Silicon migration. This
          # job is marked ``continue-on-error`` so a runner shortage
          # can't pin the whole release in "queued" state — operators
          # on Intel Macs can still install the arm64 dmg via Rosetta,
          # and the asset name redirect at ``/dl/TARS-x.y.z-x64.dmg``
          # falls back to the arm64 dmg when the Intel one is missing.
          - platform: macos-13
            target: x86_64-apple-darwin
            label: macOS-x64
            optional: true
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
            optional: false
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            optional: false

    runs-on: ${{ matrix.platform }}
    name: Build - ${{ matrix.label }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.optional }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install

      - name: Install cockpit UI deps
        working-directory: experiments/neural-showcase-v3
        run: pnpm install

      - name: Skip typecheck in CI
        working-directory: experiments/neural-showcase-v3
        shell: bash
        run: node -e "const f=require('fs');const p=JSON.parse(f.readFileSync('package.json','utf8'));p.scripts.build='vite build';f.writeFileSync('package.json',JSON.stringify(p,null,2))"

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python sidecar deps
        run: pip install -r requirements.txt

      - name: Build Python sidecar (macOS arm64)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name tars-sidecar-aarch64-apple-darwin \
            --hidden-import=tiktoken_ext.openai_public \
            --hidden-import=tiktoken_ext \
            serve.py
          mkdir -p desktop/src-tauri/binaries
          cp dist/tars-sidecar-aarch64-apple-darwin desktop/src-tauri/binaries/

      - name: Build Python sidecar (macOS x64)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name tars-sidecar-x86_64-apple-darwin \
            --hidden-import=tiktoken_ext.openai_public \
            --hidden-import=tiktoken_ext \
            serve.py
          mkdir -p desktop/src-tauri/binaries
          cp dist/tars-sidecar-x86_64-apple-darwin desktop/src-tauri/binaries/

      - name: Build Python sidecar (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name tars-sidecar-x86_64-unknown-linux-gnu \
            --hidden-import=tiktoken_ext.openai_public \
            --hidden-import=tiktoken_ext \
            serve.py
          mkdir -p desktop/src-tauri/binaries
          cp dist/tars-sidecar-x86_64-unknown-linux-gnu desktop/src-tauri/binaries/

      - name: Build Python sidecar (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name tars-sidecar-x86_64-pc-windows-msvc `
            --hidden-import=tiktoken_ext.openai_public `
            --hidden-import=tiktoken_ext `
            serve.py
          New-Item -ItemType Directory -Force -Path desktop\src-tauri\binaries
          Copy-Item dist\tars-sidecar-x86_64-pc-windows-msvc.exe desktop\src-tauri\binaries\

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing — when secrets are blank, tauri-action
          # publishes the dmg without `latest.json` (the workflow
          # gracefully degrades; auto-updates simply won't fire until
          # the operator wires real keys via desktop/scripts/generate-release-keys.sh).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer notarization — tauri-action 2.x reads these
          # env vars natively. When all six are blank the action skips
          # notarization and we fall back to the ad-hoc codesign step
          # below, so the unsigned .dmg still completes and uploads.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "TARS ${{ github.ref_name }}"
          releaseBody: |
            Automated release for ${{ github.ref_name }}.

            ## macOS first-run

            Apple Gatekeeper blocks unnotarised binaries with a "TARS is damaged"
            modal. After installing the .dmg, run **once**:

            ```bash
            xattr -dr com.apple.quarantine /Applications/TARS.app
            ```

            …or use the one-liner installer from tars.meeet.world that does it
            automatically:

            ```bash
            curl -fsSL https://tars.meeet.world/install.sh | bash
            ```

            See CHANGELOG.md for details.
          releaseDraft: false
          prerelease: false
          # Bug #9 fix from docs/SYSTEM_AUDIT_2026-05-02.md —
          # publish ``latest.json`` (Tauri updater channel JSON) as
          # a release asset so the in-app updater can poll
          # ``releases/latest/download/latest.json``. Requires
          # TAURI_SIGNING_PRIVATE_KEY to be set; falls back to
          # publishing only the artefacts when missing.
          includeUpdaterJson: true
          updaterJsonPreferNsis: false
          args: --target ${{ matrix.target }}

      # Bug #2 fix (2026-05-04 audit) — "Приложение TARS повреждено".
      # Apple Gatekeeper blocks unsigned bundles. We can't notarize
      # without the $99 Developer Program, but ad-hoc codesigning is
      # zero-cost AND lets users Right-click → Open without the
      # "damaged" modal (only "Unidentified developer" remains, which
      # the install.sh xattr command also clears).
      #
      # Wave 76: gate this step on APPLE_CERTIFICATE being EMPTY. When
      # the operator has wired the real Developer ID cert, tauri-action
      # already produced a notarized signature in the previous step —
      # running ad-hoc codesign on top of it would invalidate the
      # Developer ID signature and turn a notarized .app back into an
      # unidentified one. Only run the fallback when no real cert is set.
      - name: Ad-hoc codesign macOS app bundle (fallback when no Apple cert)
        if: runner.os == 'macOS'
        shell: bash
        env:
          HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          set -e
          if [ "${HAS_APPLE_CERT}" = "true" ]; then
            echo "Apple Developer cert detected — tauri-action already produced a notarized signature."
            echo "Skipping ad-hoc codesign so we don't invalidate the Developer ID signature."
            exit 0
          fi
          BUNDLE="desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/TARS.app"
          if [ -d "${BUNDLE}" ]; then
            echo "No APPLE_CERTIFICATE secret — falling back to ad-hoc sign on ${BUNDLE}"
            codesign --force --deep --sign - "${BUNDLE}"
            codesign --verify --deep --strict --verbose=2 "${BUNDLE}" || true
            xattr -cr "${BUNDLE}" || true
            echo "ad-hoc codesigned (operator: wire APPLE_CERTIFICATE secret to enable real notarization)"
          else
            echo "warn: macOS bundle not at ${BUNDLE} — skipping ad-hoc sign"
          fi

  notify:
    # 2026-05-04 audit-3: don't fail the whole pipeline if the only
    # missing artifact is the optional ``macOS-x64`` one. The Intel
    # mac dmg is best-effort because the macos-13 runner pool is
    # chronically queue-starved; arm64 + linux + windows must all
    # succeed.
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build result
        run: |
          # ``continue-on-error: true`` on the optional macos-13 job
          # means a single mac-x64 failure shows up as
          # ``needs.build.result == 'success'`` — that's the
          # intended behaviour.
          RESULT="${{ needs.build.result }}"
          if [ "${RESULT}" = "success" ]; then
            echo "All required builds succeeded for ${{ github.ref_name }}"
          else
            echo "::error::Required builds failed (result=${RESULT})"
            exit 1
          fi

  update-download-links:
    needs: build
    runs-on: ubuntu-latest
    # Use ``!failure() && !cancelled()`` so a single optional
    # mac-x64 failure doesn't suppress the link summary the
    # operator pastes into release notes.
    if: ${{ !failure() && !cancelled() }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update download URLs
        run: |
          TAG="${{ github.ref_name }}"
          REPO="alxvasilevvv/tars-neural-cockpit"
          echo "Release tag: ${TAG}"
          echo "Download links:"
          echo "  macOS arm64: https://github.com/${REPO}/releases/download/${TAG}/TARS_${TAG#v}_aarch64.dmg"
          echo "  macOS x64: https://github.com/${REPO}/releases/download/${TAG}/TARS_${TAG#v}_x64.dmg (may fall back to arm64 dmg + Rosetta)"
          echo "  Linux x64: https://github.com/${REPO}/releases/download/${TAG}/TARS_${TAG#v}_amd64.deb"
          echo "  Windows x64: https://github.com/${REPO}/releases/download/${TAG}/TARS_${TAG#v}_x64-setup.exe"
