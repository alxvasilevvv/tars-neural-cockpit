name: release-desktop

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
            optional: false
          # macos-13 (Intel) runners have been chronically queue-starved
          # on the GitHub free plan since Apple Silicon migration. This
          # job is marked ``continue-on-error`` so a runner shortage
          # can't pin the whole release in "queued" state — operators
          # on Intel Macs can still install the arm64 dmg via Rosetta,
          # and the asset name redirect at ``/dl/TARS-x.y.z-x64.dmg``
          # falls back to the arm64 dmg when the Intel one is missing.
          - platform: macos-13
            target: x86_64-apple-darwin
            label: macOS-x64
            optional: true
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
            optional: false
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            optional: false

    runs-on: ${{ matrix.platform }}
    name: Build - ${{ matrix.label }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.optional }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install

      - name: Install cockpit UI deps
        working-directory: experiments/neural-showcase-v3
        run: pnpm install

      - name: Skip typecheck in CI
        working-directory: experiments/neural-showcase-v3
        shell: bash
        run: node -e "const f=require('fs');const p=JSON.parse(f.readFileSync('package.json','utf8'));p.scripts.build='vite build';f.writeFileSync('package.json',JSON.stringify(p,null,2))"

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python sidecar deps
        run: pip install -r requirements.txt

      - name: Build Python sidecar (macOS arm64)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name tars-sidecar-aarch64-apple-darwin \
            --hidden-import=tiktoken_ext.openai_public \
            --hidden-import=tiktoken_ext \
            serve.py
          mkdir -p desktop/src-tauri/binaries
          cp dist/tars-sidecar-aarch64-apple-darwin desktop/src-tauri/binaries/

      - name: Build Python sidecar (macOS x64)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name tars-sidecar-x86_64-apple-darwin \
            --hidden-import=tiktoken_ext.openai_public \
            --hidden-import=tiktoken_ext \
            serve.py
          mkdir -p desktop/src-tauri/binaries
          cp dist/tars-sidecar-x86_64-apple-darwin desktop/src-tauri/binaries/

      - name: Build Python sidecar (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name tars-sidecar-x86_64-unknown-linux-gnu \
            --hidden-import=tiktoken_ext.openai_public \
            --hidden-import=tiktoken_ext \
            serve.py
          mkdir -p desktop/src-tauri/binaries
          cp dist/tars-sidecar-x86_64-unknown-linux-gnu desktop/src-tauri/binaries/

      - name: Build Python sidecar (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name tars-sidecar-x86_64-pc-windows-msvc `
            --hidden-import=tiktoken_ext.openai_public `
            --hidden-import=tiktoken_ext `
            serve.py
          New-Item -ItemType Directory -Force -Path desktop\src-tauri\binaries
          Copy-Item dist\tars-sidecar-x86_64-pc-windows-msvc.exe desktop\src-tauri\binaries\

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "TARS ${{ github.ref_name }}"
          releaseBody: |
            Automated release for ${{ github.ref_name }}.

            ## macOS first-run

            Apple Gatekeeper blocks unnotarised binaries with a "TARS is damaged"
            modal. After installing the .dmg, run **once**:

            ```bash
            xattr -dr com.apple.quarantine /Applications/TARS.app
            ```

            …or use the one-liner installer from tars.meeet.world that does it
            automatically:

            ```bash
            curl -fsSL https://tars.meeet.world/install.sh | bash
            ```

            See CHANGELOG.md for details.
          releaseDraft: false
          prerelease: false
          # Bug #9 fix from docs/SYSTEM_AUDIT_2026-05-02.md —
          # publish ``latest.json`` (Tauri updater channel JSON) as
          # a release asset so the in-app updater can poll
          # ``releases/latest/download/latest.json``. Requires
          # TAURI_SIGNING_PRIVATE_KEY to be set; falls back to
          # publishing only the artefacts when missing.
          includeUpdaterJson: true
          updaterJsonPreferNsis: false
          args: --target ${{ matrix.target }}

      # Bug #2 fix (2026-05-04 audit) — "Приложение TARS повреждено".
      # Apple Gatekeeper blocks unsigned bundles. We can't notarize
      # without the $99 Developer Program, but ad-hoc codesigning is
      # zero-cost AND lets users Right-click → Open without the
      # "damaged" modal (only "Unidentified developer" remains, which
      # the install.sh xattr command also clears).
      - name: Ad-hoc codesign macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          BUNDLE="desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/TARS.app"
          if [ -d "${BUNDLE}" ]; then
            echo "Ad-hoc signing ${BUNDLE}…"
            codesign --force --deep --sign - "${BUNDLE}"
            codesign --verify --deep --strict --verbose=2 "${BUNDLE}" || true
            xattr -cr "${BUNDLE}" || true
            echo "✓ ad-hoc codesigned"
          else
            echo "warn: macOS bundle not at ${BUNDLE} — skipping ad-hoc sign"
          fi

  notify:
    # 2026-05-04 audit-3: don't fail the whole pipeline if the only
    # missing artifact is the optional ``macOS-x64`` one. The Intel
    # mac dmg is best-effort because the macos-13 runner pool is
    # chronically queue-starved; arm64 + linux + windows must all
    # succeed.
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build result
        run: |
          # ``continue-on-error: true`` on the optional macos-13 job
          # means a single mac-x64 failure shows up as
          # ``needs.build.result == 'success'`` — that's the
          # intended behaviour.
          RESULT="${{ needs.build.result }}"
          if [ "${RESULT}" = "success" ]; then
            echo "All required builds succeeded for ${{ github.ref_name }}"
          else
            echo "::error::Required builds failed (result=${RESULT})"
            exit 1
          fi

  update-download-links:
    needs: build
    runs-on: ubuntu-latest
    # Use ``!failure() && !cancelled()`` so a single optional
    # mac-x64 failure doesn't suppress the link summary the
    # operator pastes into release notes.
    if: ${{ !failure() && !cancelled() }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update download URLs
        run: |
          TAG="${{ github.ref_name }}"
          REPO="alxvasilevvv/tars-neural-cockpit"
          echo "Release tag: ${TAG}"
          echo "Download links:"
          echo "  macOS arm64: https://github.com/${REPO}/releases/download/${TAG}/TARS_${TAG#v}_aarch64.dmg"
          echo "  macOS x64: https://github.com/${REPO}/releases/download/${TAG}/TARS_${TAG#v}_x64.dmg (may fall back to arm64 dmg + Rosetta)"
          echo "  Linux x64: https://github.com/${REPO}/releases/download/${TAG}/TARS_${TAG#v}_amd64.deb"
          echo "  Windows x64: https://github.com/${REPO}/releases/download/${TAG}/TARS_${TAG#v}_x64-setup.exe"
