name: release-desktop

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-13
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: Build - ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install

      - name: Install cockpit UI deps
        working-directory: experiments/neural-showcase-v3
        run: pnpm install

      - name: Skip typecheck in CI
        working-directory: experiments/neural-showcase-v3
        shell: bash
        run: node -e "const f=require('fs');const p=JSON.parse(f.readFileSync('package.json','utf8'));p.scripts.build='vite build';f.writeFileSync('package.json',JSON.stringify(p,null,2))"

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python sidecar deps
        run: pip install -r requirements.txt

      - name: Build Python sidecar (macOS arm64)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name tars-sidecar-aarch64-apple-darwin \
            --hidden-import=tiktoken_ext.openai_public \
            --hidden-import=tiktoken_ext \
            serve.py
          mkdir -p desktop/src-tauri/binaries
          cp dist/tars-sidecar-aarch64-apple-darwin desktop/src-tauri/binaries/

      - name: Build Python sidecar (macOS x64)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name tars-sidecar-x86_64-apple-darwin \
            --hidden-import=tiktoken_ext.openai_public \
            --hidden-import=tiktoken_ext \
            serve.py
          mkdir -p desktop/src-tauri/binaries
          cp dist/tars-sidecar-x86_64-apple-darwin desktop/src-tauri/binaries/

      - name: Build Python sidecar (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name tars-sidecar-x86_64-unknown-linux-gnu \
            --hidden-import=tiktoken_ext.openai_public \
            --hidden-import=tiktoken_ext \
            serve.py
          mkdir -p desktop/src-tauri/binaries
          cp dist/tars-sidecar-x86_64-unknown-linux-gnu desktop/src-tauri/binaries/

      - name: Build Python sidecar (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name tars-sidecar-x86_64-pc-windows-msvc `
            --hidden-import=tiktoken_ext.openai_public `
            --hidden-import=tiktoken_ext `
            serve.py
          New-Item -ItemType Directory -Force -Path desktop\src-tauri\binaries
          Copy-Item dist\tars-sidecar-x86_64-pc-windows-msvc.exe desktop\src-tauri\binaries\

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "TARS ${{ github.ref_name }}"
          releaseBody: |
            Automated release for ${{ github.ref_name }}.
            See CHANGELOG.md for details.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  notify:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build result
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "All builds succeeded for ${{ github.ref_name }}"
          else
            echo "::error::Some builds failed"
            exit 1
          fi

  update-download-links:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update download URLs
        run: |
          TAG="${{ github.ref_name }}"
          REPO="alxvasilevvv/tars-neural-cockpit"
          echo "Release tag: ${TAG}"
          echo "Download links:"
          echo "  macOS arm64: https://github.com/${REPO}/releases/download/${TAG}/TARS_${TAG#v}_aarch64.dmg"
          echo "  macOS x64: https://github.com/${REPO}/releases/download/${TAG}/TARS_${TAG#v}_x64.dmg"
          echo "  Linux x64: https://github.com/${REPO}/releases/download/${TAG}/TARS_${TAG#v}_amd64.deb"
          echo "  Windows x64: https://github.com/${REPO}/releases/download/${TAG}/TARS_${TAG#v}_x64-setup.exe"
