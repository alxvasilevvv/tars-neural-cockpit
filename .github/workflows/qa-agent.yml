name: TARS QA Agent

# Autonomous health-and-correctness probe for tars.meeet.world.
# Runs:
#   - on every push that touches the agent or related infra
#   - on every PR
#   - every 5 minutes via cron (Wave 117 — synthetic monitor in-band)
#
# Stdlib-only: no `pip install` step. Probes are tolerant of pre-DNS
# state (subdomain probes skip cleanly).
#
# W310-c (2026-05-17): GH Actions registration cache went stale on
# 2026-05-13 (e5f1911 "remove neural showcase SPA" touched path filters
# but workflow metadata never updated → `workflow.updated_at=2026-05-11`
# while file mtime is 2026-05-13). Symptom: every push to main triggers
# qa-agent (path filter ignored) and the run dies in 0 seconds with
# "workflow file issue". Touching this header forces re-registration
# on the next merge to main, which is why this comment exists.
# Once the next merge lands and a non-0s run is observed, this block
# can be deleted. See PRODUCT_MASTER_PLAN.md §2.2 (PR #175 row).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/qa_agent/**"
      - ".github/workflows/qa-agent.yml"
      - "docs/qa-snapshot.json"
  pull_request:
    paths:
      - "scripts/qa_agent/**"
      - ".github/workflows/qa-agent.yml"
      - "docs/qa-snapshot.json"
  schedule:
    - cron: "*/5 * * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  # Wave 126 — needs `write` so the scheduled run can commit
  # docs/qa-snapshot.json on status flips.
  contents: write

concurrency:
  group: qa-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: probe
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore prior alert history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qa-agent-history
          path: .qa-agent-history

      - name: Stage history.json into ~/.tars/qa-agent
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p "$HOME/.tars/qa-agent"
          if [ -f .qa-agent-history/history.json ]; then
            cp .qa-agent-history/history.json "$HOME/.tars/qa-agent/history.json"
            echo "restored prior history.json"
          else
            echo "no prior history.json — fresh start"
          fi

      - name: Run QA agent (text)
        env:
          BRIDGE_SHARED_SECRET: ${{ secrets.BRIDGE_SHARED_SECRET }}
          TARS_INGEST_API_KEY: ${{ secrets.TARS_INGEST_API_KEY }}
          # Wave 117 — Telegram escalation when 3+ consecutive failures.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OPERATOR_CHAT_ID: ${{ secrets.TELEGRAM_OPERATOR_CHAT_ID }}
          QA_AGENT_ESCALATE_ALERTS: "1"
          # Wave 75 — soft-fail during the B-019 cutover. tars.meeet.world's
          # custom domain is bound to the wrong CF Pages project (LEGACY
          # tars-meeet, stuck on 8.4.0) instead of tars-meeet-git (healthy,
          # 9.1.0). Until the operator re-binds the domain, every probe of
          # /api/product/* and core-bridge legitimately FAILs through no
          # fault of this repo. Soft-fail surfaces the FAILs in the report
          # (and the artefact upload below) without turning the workflow red
          # every 5 minutes. REMOVE this env once B-019 is closed.
          QA_AGENT_SOFT_FAIL: "1"
          # Wave 126 — emit docs/qa-snapshot.json; runner decides whether to
          # git-commit it (see "Maybe commit public snapshot").
          QA_AGENT_WRITE_SNAPSHOT: "1"
        run: |
          # 2>&1 stitched together so the runner's
          # "snapshot_commit=true|false" line (printed to stderr) lands in
          # the captured output for the grep below.
          python -m scripts.qa_agent --no-color 2> qa-stderr.txt | tee qa-report.txt
          rc=${PIPESTATUS[0]}
          cat qa-stderr.txt >&2
          # Surface the snapshot decision into a workflow output for the
          # commit step.
          if grep -q "snapshot_commit=true" qa-stderr.txt; then
            echo "snapshot_should_commit=true" >> "$GITHUB_ENV"
          else
            echo "snapshot_should_commit=false" >> "$GITHUB_ENV"
          fi
          grep -E "snapshot_(overall|reason)=" qa-stderr.txt || true
          echo "qa_agent_exit=$rc" >> "$GITHUB_ENV"
          exit $rc

      - name: Maybe commit public snapshot
        # Only on scheduled / manual runs that landed on main, and only
        # when the runner signalled a real change. PRs and forks never
        # push (no creds, no permissions). See scripts/qa_agent/snapshot.py
        # for the cadence rules — at most ~48 commits/day on a perfectly
        # green deployment.
        if: |
          env.snapshot_should_commit == 'true'
          && github.ref == 'refs/heads/main'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          set -e
          SNAP=docs/qa-snapshot.json
          if [ ! -f "$SNAP" ]; then
            echo "snapshot file missing — skipping commit"
            exit 0
          fi
          git config user.name  "tars-qa-agent[bot]"
          git config user.email "tars-qa-agent@meeet.world"
          git add "$SNAP"
          if git diff --staged --quiet; then
            echo "no diff to commit"
            exit 0
          fi
          git commit -m "chore(status): qa-agent snapshot refresh

Wave 126 automated snapshot publish.
Triggered by run ${{ github.run_id }}."
          git push origin HEAD:main || echo "push failed (likely race) — next run will retry"

      - name: Persist alert history
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p .qa-agent-history
          if [ -f "$HOME/.tars/qa-agent/history.json" ]; then
            cp "$HOME/.tars/qa-agent/history.json" .qa-agent-history/history.json
          else
            echo '{}' > .qa-agent-history/history.json
          fi

      - name: Upload alert history artifact
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: qa-agent-history
          path: .qa-agent-history/history.json
          retention-days: 7
          overwrite: true

      - name: Run QA agent (json artifact)
        if: always()
        env:
          BRIDGE_SHARED_SECRET: ${{ secrets.BRIDGE_SHARED_SECRET }}
          TARS_INGEST_API_KEY: ${{ secrets.TARS_INGEST_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OPERATOR_CHAT_ID: ${{ secrets.TELEGRAM_OPERATOR_CHAT_ID }}
        run: |
          python -m scripts.qa_agent --json --no-color > qa-report.json || true

      - name: Append to GH summary
        if: always()
        run: |
          {
            echo "## TARS QA Agent — $(date -u +%FT%TZ)"
            echo ""
            echo '```'
            head -200 qa-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ github.run_id }}
          path: |
            qa-report.txt
            qa-report.json
          retention-days: 30
