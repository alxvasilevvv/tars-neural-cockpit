name: credential sentinel

# Fail fast if a Cloudflare API token literal (or other obvious secret
# shapes) ever lands in the working tree. Lightweight regex scan over the
# checked-out files; no third-party action.
#
# Runs on:
#   - every push to any branch (catches local agents about to merge)
#   - every PR (catches contributions before review)
#
# Adding new patterns is encouraged — keep them anchored enough to avoid
# matching variable / placeholder names like `<the-value>` or
# `${{ secrets.* }}`.
#
# W310-au (2026-05-19): GH Actions registration cache may be stale on
# this workflow (job name "scan working tree" fails in ~2 s on every PR
# — same root cause as qa-agent.yml per W310-c). Touching this header
# forces re-registration on the next merge to main. Pair with PR #188
# (qa-agent) + sibling touches on e2e-suite.yml and eval-suite.yml.

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: credential-sentinel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan working tree
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Scan for credential literals
        shell: bash
        run: |
          set -uo pipefail

          # Patterns we never expect to see in committed source. Each entry
          # is a label + extended-regex + optional path-exclude pattern.
          # Matches are reported via grep -rIn so that operator can audit
          # surface area before doing forced-history rewrites.
          fail=0
          scan() {
            local label="$1" pattern="$2"
            shift 2
            local excludes=("$@")

            local args=( -rInE --binary-files=without-match
                         --exclude-dir=.git
                         --exclude-dir=node_modules
                         --exclude-dir=target
                         --exclude=*.lock
                         --exclude=*.lockb )
            local e
            for e in "${excludes[@]}"; do args+=( --exclude="$e" ); done

            local out
            out=$(grep "${args[@]}" "$pattern" . || true)
            if [[ -n "$out" ]]; then
              echo "::error title=credential sentinel::$label literal found in working tree"
              echo "$out"
              fail=1
            fi
          }

          # Cloudflare account-scoped API token (cfat_ + 40-50 hex/base32).
          # `cf-operator.env` is the local-only operator file (gitignored,
          # never tracked) — exclude defensively so a stray developer
          # checkout-with-secrets does not red-flag the workflow.
          scan "Cloudflare API token" \
               'cfat_[A-Za-z0-9]{40,}' \
               "credential-sentinel.yml" "cf-operator.env"

          # Cloudflare global API key (legacy 37-char hex).
          scan "Cloudflare global API key" \
               '\bcfgk_[A-Za-z0-9]{32,}\b' \
               "credential-sentinel.yml" "cf-operator.env"

          # Generic Bearer token literals embedded in source code (excludes
          # docs / example placeholders that use `<>` or `xxx`).
          scan "hard-coded Bearer token" \
               'Bearer[[:space:]]+[A-Za-z0-9._\-]{32,}' \
               "credential-sentinel.yml" "*.md" "*.json" "*.yaml" "*.yml" \
               "agent-transcripts/*"

          if [[ "$fail" != "0" ]]; then
            echo "::error::credential sentinel detected leaked literals — see annotations above"
            exit 1
          fi
          echo "credential sentinel: clean"
