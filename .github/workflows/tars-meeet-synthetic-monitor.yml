name: tars.meeet.world — synthetic monitor

# Zero-vendor health checker. Runs every 15 minutes, hits the production
# surface, and fails (which sends a GitHub notification email) if any
# critical endpoint is unhealthy. Documented as the answer to
# `docs/OBSERVABILITY.md` §6 future-work-2 ("pulse alert").
#
# Endpoints probed:
#   - https://tars.meeet.world/                            (SPA root)
#   - https://tars.meeet.world/api/product/downloads        (manifest)
#   - https://hhpaukjobskcwkxbgecl.supabase.co/.../tars-downloads (origin)
#   - https://zujrmifaabkletgnpoyw.supabase.co/.../core-bridge/health (cross-project)
#
# The job is skip-on-no-DNS friendly: when tars.meeet.world doesn't
# resolve yet (pre-launch), the job still completes the Supabase
# probes and skips the subdomain probes with a notice. Once DNS is
# wired the full set runs.
#
# Required repo secrets:
#   BRIDGE_SHARED_SECRET   — for the core-bridge health probe.
#                            (Optional. If absent, the core-bridge
#                            probe is skipped with a warning.)

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes. Cron uses UTC.
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: tars-meeet-synthetic
  cancel-in-progress: false

jobs:
  probe:
    name: probe production endpoints
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Resolve tars.meeet.world
        id: resolve
        run: |
          if dig +short +time=2 +tries=1 tars.meeet.world | grep -qE '\.'; then
            echo "live=true" >> "$GITHUB_OUTPUT"
            echo "DNS for tars.meeet.world resolves."
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "::warning::tars.meeet.world DNS does not resolve yet. Subdomain probes will be skipped."
          fi

      - name: Probe SPA root
        if: steps.resolve.outputs.live == 'true'
        run: |
          set -e
          status=$(curl -sI -o /dev/null -w '%{http_code}' --max-time 10 https://tars.meeet.world/)
          contract=$(curl -sI --max-time 10 https://tars.meeet.world/ | awk -F': ' 'tolower($1) == "x-tars-contract" {gsub(/\r/, "", $2); print $2; exit}')
          if [[ "$status" != "200" ]]; then
            echo "::error::SPA root returned $status (expected 200)"; exit 1
          fi
          if [[ "$contract" != "1.0.0" ]]; then
            echo "::error::Missing or wrong X-Tars-Contract header (got '$contract', expected 1.0.0)"; exit 1
          fi
          echo "OK: / 200 with X-Tars-Contract: 1.0.0"

      - name: Probe downloads manifest (proxied)
        if: steps.resolve.outputs.live == 'true'
        run: |
          set -e
          body=$(curl -sf --max-time 10 https://tars.meeet.world/api/product/downloads)
          if ! echo "$body" | grep -q '"contract_version":"1.0.0"'; then
            echo "::error::manifest missing contract_version 1.0.0"; echo "$body" | head -c 400; exit 1
          fi
          if ! echo "$body" | grep -q '"releases"'; then
            echo "::error::manifest missing releases array"; echo "$body" | head -c 400; exit 1
          fi
          echo "OK: /api/product/downloads"

      - name: Probe downloads manifest (origin)
        run: |
          set -e
          status=$(curl -sf -o /tmp/origin-manifest.json -w '%{http_code}' --max-time 10 \
            -H "Origin: https://tars.meeet.world" \
            https://hhpaukjobskcwkxbgecl.supabase.co/functions/v1/tars-downloads)
          if [[ "$status" != "200" ]]; then
            echo "::error::origin manifest returned $status"; cat /tmp/origin-manifest.json | head -c 400; exit 1
          fi
          echo "OK: tars-downloads origin"

      - name: Probe core-bridge /health
        env:
          BRIDGE_SHARED_SECRET: ${{ secrets.BRIDGE_SHARED_SECRET }}
        run: |
          if [[ -z "$BRIDGE_SHARED_SECRET" ]]; then
            echo "::warning::BRIDGE_SHARED_SECRET secret is not set — skipping core-bridge probe"
            exit 0
          fi
          status=$(curl -sf -o /tmp/bridge-health.json -w '%{http_code}' --max-time 10 \
            -H "x-bridge-secret: $BRIDGE_SHARED_SECRET" \
            -H "Origin: https://tars.meeet.world" \
            https://zujrmifaabkletgnpoyw.supabase.co/functions/v1/core-bridge/health)
          if [[ "$status" != "200" ]]; then
            echo "::error::core-bridge /health returned $status"; cat /tmp/bridge-health.json | head -c 400; exit 1
          fi
          echo "OK: core-bridge /health"

      - name: Summary
        if: always()
        run: |
          echo "## tars.meeet.world synthetic monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Probe | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| DNS resolves | ${{ steps.resolve.outputs.live }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run finished | $(date -u +%FT%TZ) |" >> "$GITHUB_STEP_SUMMARY"
