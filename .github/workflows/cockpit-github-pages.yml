name: Showcase — GitHub Pages

# One-time repo setup (owner): Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "experiments/neural-showcase-v3/**"
      - ".github/workflows/cockpit-github-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-showcase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: experiments/neural-showcase-v3/package-lock.json

      - name: Install deps
        working-directory: experiments/neural-showcase-v3
        run: npm ci

      - name: Build
        working-directory: experiments/neural-showcase-v3
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Uncomment when a public HTTPS API endpoint exists:
          # VITE_TARS_API: https://api.example.com/api
        run: npm run build

      # GitHub Pages /project/ SPA: reload on nested routes serves 404 from server;
      # duplicate index so client router loads.
      - name: SPA 404
        working-directory: experiments/neural-showcase-v3
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: experiments/neural-showcase-v3/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
