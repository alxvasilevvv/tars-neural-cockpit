name: tars.meeet.world — Cloudflare Pages

# Build the marketing surface and deploy to Cloudflare Pages on every
# push to main that touches the showcase or this workflow file. Preview
# deployments are produced on every PR.
#
# One-time repo setup (Operator):
#   1. Create a Cloudflare Pages project named `tars-meeet`. Bind it to
#      the custom domain `tars.meeet.world` once DNS is provisioned
#      (see `docs/TARS_MEEET_OPS_TODO.md`).
#   2. Deploy pick ONE:
#        A) Secrets: CLOUDFLARE_API_TOKEN (Pages:Edit) + CLOUDFLARE_ACCOUNT_ID
#           → wrangler deploy from this workflow.
#        B) No API token: delete CLOUDFLARE_API_TOKEN; connect the same GitHub
#           repo in Cloudflare Pages and build with `npm ci && npm run build:cf`
#           (see `docs/TARS_MEEET_OPS_TODO.md` — Step 2bis).
#   3. Add these Pages-side env vars (Pages → Settings → Environment Variables):
#        - BRIDGE_SHARED_SECRET — same value Lovable uses on `core-bridge`.
#        - CORE_BRIDGE_URL      — defaults to prod core-bridge if unset.
#
# Without those secrets the workflow degrades to a build-only smoke
# check (no deploy step) so pushes to main never fail solely on
# missing infra.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/neural-showcase-v3/**"
      - "docs/CHANGELOG_AGENTS.md"
      - "docs/CHANGELOG_PUBLIC.md"
      - "scripts/generate_public_changelog.py"
      - ".github/workflows/tars-meeet-cloudflare-pages.yml"
  pull_request:
    paths:
      - "experiments/neural-showcase-v3/**"
      - "docs/CHANGELOG_AGENTS.md"
      - "docs/CHANGELOG_PUBLIC.md"
      - "scripts/generate_public_changelog.py"
      - ".github/workflows/tars-meeet-cloudflare-pages.yml"

permissions:
  contents: read
  deployments: write

concurrency:
  group: tars-meeet-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: build · deploy
    runs-on: ubuntu-22.04
    # npm 10+ / npx is non-interactive on Actions — allow wrangler install without TTY.
    # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 silences the Node 20 deprecation
    # warning for actions/checkout, setup-node, setup-python (Node 20 EOL on
    # GH-runners is 2026-09-16; default flips 2026-06-02).
    env:
      NPM_CONFIG_YES: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ``npm run build`` runs ``prebuild`` which regenerates
      # ``docs/CHANGELOG_PUBLIC.md`` from ``CHANGELOG_AGENTS.md``,
      # so the SPA bundle is always fresh in CI — but the *committed*
      # ``CHANGELOG_PUBLIC.md`` would drift silently unless agents
      # re-run the script after every append. This check fails the job
      # when GitHub's view of the public changelog disagrees with the
      # generator (same contract as ``pnpm changelog:check`` in v3).
      - name: Changelog public artefact in sync
        run: python3 scripts/generate_public_changelog.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: experiments/neural-showcase-v3/package-lock.json

      - name: Install deps
        working-directory: experiments/neural-showcase-v3
        run: npm ci

      - name: Type check
        working-directory: experiments/neural-showcase-v3
        run: npm run typecheck

      - name: Unit tests
        working-directory: experiments/neural-showcase-v3
        run: npm test

      - name: Build (production)
        working-directory: experiments/neural-showcase-v3
        env:
          VITE_TARS_API: https://tars.meeet.world
        run: npm run build

      # Do **not** copy `index.html` → `404.html`. When `404.html`
      # exists, Cloudflare Pages serves it for unknown paths with a real
      # **HTTP 404** while still returning the SPA shell body — all
      # client-side routes break analytics + crawlers + our QA agent
      # (see 2026-05-01 incident on `/install`, `/cockpit`, …).
      # Deep links are covered by `public/_redirects`:
      #   /*    /index.html    200

      # Probe whether the deploy secrets are configured. The job NEVER
      # fails because of missing or broken Cloudflare API credentials —
      # Plan B (Cloudflare Pages Git integration) keeps prod up
      # without any secret in GH. The probe just decides whether the
      # wrangler-based Plan A deploy step runs.
      - name: Probe deploy credentials
        id: probe
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$API_TOKEN" && -n "$ACCOUNT_ID" ]]; then
            echo "secrets_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "secrets_present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Plan A inactive (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID unset). Plan B (Pages Git integration) deploys prod — see docs/TARS_MEEET_OPS_TODO.md Step 2bis."
          fi

      # Verify the supplied token can actually edit Pages. ANY failure
      # here downgrades the run to "build only" (still green) and lets
      # Plan B keep prod alive. The job WILL NOT fail on a bad token.
      - name: Preflight — Cloudflare token can edit Pages project
        id: preflight
        if: steps.probe.outputs.secrets_present == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          CF_TOKEN="${CF_TOKEN#Bearer }"
          CF_TOKEN="$(echo -n "$CF_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          CF_ACCOUNT="$(echo -n "$CF_ACCOUNT" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          downgrade() {
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Plan A preflight failed: $1. Skipping wrangler deploy — Plan B (Pages Git integration) handles prod. To re-enable Plan A: mint a token with Account → Cloudflare Pages → Edit, scoped to the right account."
            exit 0
          }
          [[ -n "$CF_TOKEN" && -n "$CF_ACCOUNT" ]] || downgrade "empty token or account id after trim"
          tmp="$(mktemp)"
          code=$(curl -sS -o "$tmp" -w "%{http_code}" --max-time 12 \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/tars-meeet" || echo 000)
          if [[ "$code" != "200" ]]; then
            echo "Body (truncated):"
            head -c 1200 "$tmp" || true
            echo
            downgrade "Cloudflare API GET pages/projects/tars-meeet returned HTTP ${code}"
          fi
          if ! jq -e '.success == true' "$tmp" >/dev/null 2>&1; then
            echo "Body (truncated):"
            head -c 1200 "$tmp" || true
            echo
            downgrade "Cloudflare API responded success=false"
          fi
          echo "deploy_ready=true" >> "$GITHUB_OUTPUT"
          echo "OK: token can edit Cloudflare Pages project tars-meeet"

      # Deploy must run with `experiments/neural-showcase-v3/` as the
      # working directory so wrangler picks up the sibling `functions/`
      # tree (Pages Functions for `/api/product/{downloads,version}` and
      # `/api/client-error`). Without that, wrangler only uploads the
      # static `dist/` and the API endpoints disappear in production. See
      # the regression on commit 195547a7 (2026-05-01) where the manifest
      # endpoint 404'd until a manual hot-fix re-deploy from the project
      # root restored the Functions bundle.
      - name: Deploy to Cloudflare Pages (Plan A — wrangler)
        if: steps.preflight.outputs.deploy_ready == 'true'
        env:
          # Passed through to wrangler-action's npx install (job-level env
          # is not always visible inside the action's Node subprocess).
          NPM_CONFIG_YES: "true"
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: experiments/neural-showcase-v3
          wranglerVersion: "4.14.4"
          command: pages deploy dist --project-name=tars-meeet --branch=${{ github.head_ref || github.ref_name }}

      # Smoke runs on EVERY push to main, regardless of which deploy path
      # produced the bundle. Plan B (Cloudflare Git integration) keeps
      # prod up even when this workflow does not deploy itself, so the
      # smoke is still meaningful — it catches regressions where the
      # Functions tree disappears (the 2026-05-01 incident on `/install`,
      # `/cockpit`, `/api/product/*`).
      - name: Smoke (manifest reachable)
        id: smoke_manifest
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            body=$(curl -sf --max-time 10 https://tars.meeet.world/api/product/downloads || true)
            if echo "$body" | grep -q '"contract_version":"1.0.0"'; then
              echo "OK: manifest reachable on attempt $attempt"
              exit 0
            fi
            echo "manifest not yet reachable (attempt $attempt) — sleeping"
            sleep 12
          done
          echo "::warning::manifest endpoint did not return a valid body within 96s — investigate Plan B build status in Cloudflare Pages dashboard."
          exit 1

      - name: Smoke (SPA install route → HTTP 200)
        id: smoke_install
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              https://tars.meeet.world/install)
            if [[ "$code" == "200" ]]; then
              echo "OK: /install -> HTTP $code (attempt $attempt)"
              exit 0
            fi
            echo "/install returned HTTP $code (attempt $attempt) — sleeping"
            sleep 12
          done
          echo "::warning::/install never returned HTTP 200 — Plan B build may have stalled or _redirects regressed."
          exit 1

      # The smoke steps above use ``continue-on-error`` so a transient
      # Cloudflare propagation hiccup does not turn the workflow red.
      # We surface the verdict in the run summary instead.
      - name: Smoke summary
        if: github.event_name == 'push' && always()
        run: |
          mani="${{ steps.smoke_manifest.outcome }}"
          inst="${{ steps.smoke_install.outcome }}"
          {
            echo "## tars.meeet.world prod smoke"
            echo
            echo "| probe | outcome |"
            echo "| --- | --- |"
            echo "| /api/product/downloads | ${mani} |"
            echo "| /install | ${inst} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$mani" != "success" || "$inst" != "success" ]]; then
            echo "::warning::prod smoke saw at least one non-success — synthetic monitor (every 15min) will catch persistent regressions and email."
          fi
