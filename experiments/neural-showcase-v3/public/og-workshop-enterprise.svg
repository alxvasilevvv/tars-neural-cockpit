<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="halo" cx="900" cy="320" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#f5f5f0" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Top hairline accent -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#brand)" opacity="0.85"/>

  <!-- Corner ticks -->
  <g stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5" fill="none">
    <path d="M 60 60 L 60 84 M 60 60 L 84 60"/>
    <path d="M 1140 60 L 1140 84 M 1140 60 L 1116 60"/>
    <path d="M 60 570 L 60 546 M 60 570 L 84 570"/>
    <path d="M 1140 570 L 1140 546 M 1140 570 L 1116 570"/>
  </g>

  <!-- Eyebrow -->
  <g transform="translate(80 110)">
    <circle cx="0" cy="-2" r="3" fill="#06B6D4"/>
    <text x="14" y="2" font-family="'Fira Code', ui-monospace, monospace" font-size="14" fill="#a09e96" letter-spacing="3px">ENTERPRISE WORKSHOP · TARS</text>
  </g>

  <!-- Headline -->
  <g transform="translate(80 230)">
    <text font-family="'Share Tech Mono', monospace" font-size="92" font-weight="500" fill="#f5f5f0" letter-spacing="-2px">
      <tspan x="0" y="0">Algorithmic</tspan>
      <tspan x="0" y="106" fill="url(#brand)">Workshop.</tspan>
    </text>
  </g>

  <!-- Sub -->
  <g transform="translate(80 470)">
    <text font-family="'Fira Code', monospace" font-size="22" fill="#a09e96" letter-spacing="0.2px">
      <tspan x="0" y="0">Built for funds + quant teams.</tspan>
      <tspan x="0" y="34">Fund partners + research desks — one day, five playbooks.</tspan>
    </text>
  </g>

  <!-- Risk gates pill row -->
  <g transform="translate(80 570)" font-family="'Fira Code', monospace" font-size="11">
    <g>
      <rect x="0" y="0" width="118" height="28" rx="14" fill="none" stroke="#8B5CF6" stroke-opacity="0.6"/>
      <text x="59" y="18" fill="#8B5CF6" text-anchor="middle" letter-spacing="2px">RISK GATE</text>
    </g>
    <g transform="translate(130 0)">
      <rect x="0" y="0" width="138" height="28" rx="14" fill="none" stroke="#06B6D4" stroke-opacity="0.6"/>
      <text x="69" y="18" fill="#06B6D4" text-anchor="middle" letter-spacing="2px">VAULT-KEY</text>
    </g>
    <g transform="translate(280 0)">
      <rect x="0" y="0" width="124" height="28" rx="14" fill="none" stroke="#A78BFA" stroke-opacity="0.6"/>
      <text x="62" y="18" fill="#A78BFA" text-anchor="middle" letter-spacing="2px">MULTI-SIG</text>
    </g>
    <g transform="translate(416 0)">
      <rect x="0" y="0" width="138" height="28" rx="14" fill="none" stroke="#6366F1" stroke-opacity="0.6"/>
      <text x="69" y="18" fill="#6366F1" text-anchor="middle" letter-spacing="2px">DAILY CAPS</text>
    </g>
  </g>

  <!-- Right-side trading-chart abstract monolith -->
  <g transform="translate(820 175)">
    <!-- Frame -->
    <rect x="0" y="0" width="300" height="280" rx="8" fill="#0b0b10" stroke="url(#brand)" stroke-width="2"/>

    <!-- Grid -->
    <g stroke="#f5f5f0" stroke-opacity="0.06" stroke-width="1">
      <line x1="0" y1="56" x2="300" y2="56"/>
      <line x1="0" y1="112" x2="300" y2="112"/>
      <line x1="0" y1="168" x2="300" y2="168"/>
      <line x1="0" y1="224" x2="300" y2="224"/>
      <line x1="60" y1="0" x2="60" y2="280"/>
      <line x1="120" y1="0" x2="120" y2="280"/>
      <line x1="180" y1="0" x2="180" y2="280"/>
      <line x1="240" y1="0" x2="240" y2="280"/>
    </g>

    <!-- Equity curve (rising mean-reversion) -->
    <path d="M 16 220 L 50 198 L 84 208 L 118 168 L 152 178 L 186 132 L 220 142 L 254 92 L 286 76"
          fill="none" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Drawdown band -->
    <path d="M 16 220 L 50 198 L 84 208 L 118 168 L 152 178 L 186 132 L 220 142 L 254 92 L 286 76 L 286 252 L 16 252 Z"
          fill="#06B6D4" fill-opacity="0.08"/>

    <!-- HIL approve marker -->
    <circle cx="254" cy="92" r="6" fill="#A78BFA"/>
    <circle cx="254" cy="92" r="11" fill="none" stroke="#A78BFA" stroke-opacity="0.5"/>

    <!-- Top label -->
    <g font-family="'Fira Code', monospace" font-size="10" fill="#a09e96" letter-spacing="2px">
      <text x="14" y="22">EQUITY · BTC/USDT · 2024</text>
      <text x="240" y="22" fill="#06B6D4">+18.3%</text>
    </g>
    <g font-family="'Fira Code', monospace" font-size="9" fill="#5c5a52" letter-spacing="1.5px">
      <text x="14" y="270">SHARPE 1.82  ·  DD 9.4%  ·  HIL APPROVED</text>
    </g>
  </g>

  <!-- Bottom right meta -->
  <g transform="translate(80 612)">
    <text font-family="'Fira Code', monospace" font-size="13" fill="#5c5a52" letter-spacing="2.4px">TARS · MEEET.WORLD · WORKSHOP</text>
  </g>
</svg>
