<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="halo" cx="950" cy="280" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#06B6D4" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#f5f5f0" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>
  <rect x="0" y="0" width="1200" height="2" fill="url(#brand)" opacity="0.85"/>

  <g stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5" fill="none">
    <path d="M 60 60 L 60 84 M 60 60 L 84 60"/>
    <path d="M 1140 60 L 1140 84 M 1140 60 L 1116 60"/>
    <path d="M 60 570 L 60 546 M 60 570 L 84 570"/>
    <path d="M 1140 570 L 1140 546 M 1140 570 L 1116 570"/>
  </g>

  <g transform="translate(80 110)">
    <circle cx="0" cy="-2" r="3" fill="#8B5CF6"/>
    <text x="14" y="2" font-family="'Fira Code', ui-monospace, monospace" font-size="14" fill="#a09e96" letter-spacing="3px">TARS · PITCH DECK · 12 SLIDES</text>
  </g>

  <g transform="translate(80 230)">
    <text font-family="'Share Tech Mono', monospace" font-size="92" font-weight="500" fill="#f5f5f0" letter-spacing="-2px">
      <tspan x="0" y="0">Operators don't</tspan>
      <tspan x="0" y="106">want chat.</tspan>
      <tspan x="0" y="212" fill="url(#brand)">They want it done.</tspan>
    </text>
  </g>

  <!-- Slide-counter card -->
  <g transform="translate(900 470)">
    <rect x="-130" y="-50" width="260" height="100" rx="14" fill="#0b0b10" stroke="#6366F1" stroke-opacity="0.5"/>
    <text x="0" y="-12" font-family="'Fira Code', monospace" font-size="13" fill="#a09e96" letter-spacing="2.4" text-anchor="middle">SLIDES · KEYBOARD NAV</text>
    <text x="0" y="26" font-family="'Share Tech Mono', monospace" font-size="42" font-weight="500" fill="#f5f5f0" letter-spacing="2" text-anchor="middle" font-variant-numeric="tabular-nums">01 / 12</text>
  </g>

  <g transform="translate(80 600)">
    <text font-family="'Fira Code', monospace" font-size="13" fill="#5c5a52" letter-spacing="2.4px">MEEET.WORLD/PITCH · OPERATOR-GRADE · 2026</text>
  </g>
</svg>
