      <circle cx="40" cy="44" r="8" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
      <text x="56" y="48" font-family="'Fira Code', monospace" font-size="11" fill="#A78BFA" letter-spacing="1.5px">WALLET.SIGN · 0.5 SOL</text>
    </g>
    <g>
      <rect x="20" y="78" width="260" height="48" rx="4" fill="#06B6D4" fill-opacity="0.1" stroke="#06B6D4" stroke-opacity="0.4"/>
      <path d="M 36 44 L 42 50 L 50 40" transform="translate(0 60)" fill="none" stroke="#06B6D4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="40" cy="102" r="8" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="56" y="106" font-family="'Fira Code', monospace" font-size="11" fill="#06B6D4" letter-spacing="1.5px">OUTREACH.SEND · 12 emails</text>
    </g>
    <g>
      <rect x="20" y="136" width="260" height="48" rx="4" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.4"/>
      <circle cx="40" cy="160" r="8" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="56" y="164" font-family="'Fira Code', monospace" font-size="11" fill="#8B5CF6" letter-spacing="1.5px">CODE.EDIT · 4 files</text>
    </g>
