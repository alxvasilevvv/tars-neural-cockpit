      <circle cx="40" cy="218" r="8" fill="none" stroke="#6366F1" stroke-width="1.5"/>
      <text x="56" y="222" font-family="'Fira Code', monospace" font-size="11" fill="#6366F1" letter-spacing="1.5px">LIVE.PROMOTE · paper→live</text>
