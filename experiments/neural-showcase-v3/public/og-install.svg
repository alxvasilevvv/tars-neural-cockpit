<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="halo" cx="200" cy="500" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#f5f5f0" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>
  <rect x="0" y="0" width="1200" height="2" fill="url(#brand)" opacity="0.85"/>

  <g stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5" fill="none">
    <path d="M 60 60 L 60 84 M 60 60 L 84 60"/>
    <path d="M 1140 60 L 1140 84 M 1140 60 L 1116 60"/>
    <path d="M 60 570 L 60 546 M 60 570 L 84 570"/>
    <path d="M 1140 570 L 1140 546 M 1140 570 L 1116 570"/>
  </g>

  <g transform="translate(80 110)">
    <circle cx="0" cy="-2" r="3" fill="#06B6D4"/>
    <text x="14" y="2" font-family="'Fira Code', ui-monospace, monospace" font-size="14" fill="#a09e96" letter-spacing="3px">TARS · INSTALL · ONE CURL · 60 SEC</text>
  </g>

  <g transform="translate(80 230)">
    <text font-family="'Share Tech Mono', monospace" font-size="86" font-weight="500" fill="#f5f5f0" letter-spacing="-2px">
      <tspan x="0" y="0">No signup.</tspan>
      <tspan x="0" y="100">No cloud lock-in.</tspan>
      <tspan x="0" y="200" fill="url(#brand)">Sixty seconds.</tspan>
    </text>
  </g>

  <!-- Curl pill -->
  <g transform="translate(80 510)">
    <rect x="0" y="0" width="980" height="64" rx="12" fill="#0b0b10" stroke="#6366F1" stroke-opacity="0.55"/>
    <text x="24" y="42" font-family="'Fira Code', monospace" font-size="20" fill="#6366F1">$</text>
    <text x="50" y="42" font-family="'Fira Code', monospace" font-size="11" fill="#f5f5f0">curl -fLO https://github.com/alxvasilevvv/tars-neural-cockpit/releases/download/v8.4.0/TARS_8.4.0_aarch64.dmg</text>
  </g>

  <!-- OS chips -->
  <g transform="translate(80 600)" font-family="'Fira Code', monospace" font-size="13" fill="#5c5a52" letter-spacing="2.4px">
    <text>MACOS · LINUX · WINDOWS · TARS.MEEET.WORLD/INSTALL</text>
  </g>
</svg>
