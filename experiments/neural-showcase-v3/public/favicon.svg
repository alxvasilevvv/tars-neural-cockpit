<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    TARS · meeet.world favicon (regenerated 2026-05-04 to match the
    desktop app icon — serif "T" on an indigo→violet gradient with a
    soft cyan halo. SVG twin of desktop/assets/icon-source.png.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="halo" cx="32" cy="32" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#06B6D4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tFill" x1="32" y1="14" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>

  <!-- macOS-style squircle background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
  <!-- Cyan halo behind the glyph -->
  <circle cx="32" cy="32" r="22" fill="url(#halo)"/>

  <!-- Serif capital "T" — bar + stem with subtle serifs at the foot
       so it reads at 16×16 too. Bar y=18, stem from 18 to 50. -->
  <g fill="url(#tFill)">
    <rect x="14" y="18" width="36" height="6" rx="1.5"/>
    <rect x="29" y="18" width="6" height="32" rx="1"/>
    <!-- Foot serifs -->
    <rect x="25" y="46" width="14" height="4" rx="1"/>
  </g>

  <!-- Subtle ring outline echoing the desktop icon's halo -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#06B6D4" stroke-width="0.8" opacity="0.35"/>
</svg>
