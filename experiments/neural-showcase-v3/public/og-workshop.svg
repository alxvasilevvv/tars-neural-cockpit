<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="halo" cx="900" cy="320" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#f5f5f0" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Top hairline accent -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#brand)" opacity="0.85"/>

  <!-- Corner ticks -->
  <g stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5" fill="none">
    <path d="M 60 60 L 60 84 M 60 60 L 84 60"/>
    <path d="M 1140 60 L 1140 84 M 1140 60 L 1116 60"/>
    <path d="M 60 570 L 60 546 M 60 570 L 84 570"/>
    <path d="M 1140 570 L 1140 546 M 1140 570 L 1116 570"/>
  </g>

  <!-- Eyebrow -->
  <g transform="translate(80 110)">
    <circle cx="0" cy="-2" r="3" fill="#06B6D4"/>
    <text x="14" y="2" font-family="'Fira Code', ui-monospace, monospace" font-size="14" fill="#a09e96" letter-spacing="3px">TARS · WORKSHOP</text>
  </g>

  <!-- Headline -->
  <g transform="translate(80 230)">
    <text font-family="'Share Tech Mono', monospace" font-size="84" font-weight="500" fill="#f5f5f0" letter-spacing="-2px">
      <tspan x="0" y="0">Build → Test →</tspan>
      <tspan x="0" y="98" fill="url(#brand)">Deploy → Audit.</tspan>
    </text>
  </g>

  <!-- Sub -->
  <g transform="translate(80 460)">
    <text font-family="'Fira Code', monospace" font-size="22" fill="#a09e96" letter-spacing="0.2px">
      <tspan x="0" y="0">Compose a playbook, design an agent, backtest it,</tspan>
      <tspan x="0" y="34">ship it. Receipts on every step.</tspan>
    </text>
  </g>

  <!-- Phase pills row -->
  <g transform="translate(80 570)" font-family="'Fira Code', monospace" font-size="11">
    <g>
      <rect x="0" y="0" width="92" height="28" rx="14" fill="none" stroke="#6366F1" stroke-opacity="0.6"/>
      <text x="46" y="18" fill="#6366F1" text-anchor="middle" letter-spacing="2px">DESIGN</text>
    </g>
    <g transform="translate(104 0)">
      <rect x="0" y="0" width="78" height="28" rx="14" fill="none" stroke="#06B6D4" stroke-opacity="0.6"/>
      <text x="39" y="18" fill="#06B6D4" text-anchor="middle" letter-spacing="2px">TEST</text>
    </g>
    <g transform="translate(192 0)">
      <rect x="0" y="0" width="92" height="28" rx="14" fill="none" stroke="#8B5CF6" stroke-opacity="0.6"/>
      <text x="46" y="18" fill="#8B5CF6" text-anchor="middle" letter-spacing="2px">DEPLOY</text>
    </g>
    <g transform="translate(294 0)">
      <rect x="0" y="0" width="84" height="28" rx="14" fill="none" stroke="#A78BFA" stroke-opacity="0.6"/>
      <text x="42" y="18" fill="#A78BFA" text-anchor="middle" letter-spacing="2px">AUDIT</text>
    </g>
  </g>

  <!-- Right-side workshop monolith (4 stacked phase tiles) -->
  <g transform="translate(820 165)">
    <g stroke="url(#brand)" stroke-width="2" fill="none">
      <rect x="0" y="0" width="280" height="68" rx="6" fill="#6366F1" fill-opacity="0.12"/>
      <rect x="0" y="80" width="280" height="68" rx="6" fill="#06B6D4" fill-opacity="0.12"/>
      <rect x="0" y="160" width="280" height="68" rx="6" fill="#8B5CF6" fill-opacity="0.12"/>
      <rect x="0" y="240" width="280" height="68" rx="6" fill="#A78BFA" fill-opacity="0.12"/>
    </g>
    <g font-family="'Fira Code', monospace" font-size="13" fill="#f5f5f0" letter-spacing="2.4px">
      <text x="20" y="42">01 · DESIGN</text>
      <text x="20" y="122">02 · TEST</text>
      <text x="20" y="202">03 · DEPLOY</text>
      <text x="20" y="282">04 · AUDIT</text>
    </g>
    <g font-family="'Fira Code', monospace" font-size="11" fill="#a09e96">
      <text x="160" y="42">playbook + agent</text>
      <text x="180" y="122">backtest + sse</text>
      <text x="170" y="202">paper → live</text>
      <text x="180" y="282">receipts + csv</text>
    </g>
  </g>

  <!-- Bottom right meta -->
  <g transform="translate(80 612)">
    <text font-family="'Fira Code', monospace" font-size="13" fill="#5c5a52" letter-spacing="2.4px">B2B · TEAMS + FUNDS · MEEET.WORLD</text>
  </g>
</svg>
