<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 200" role="img" aria-label="TARS">
  <title>TARS</title>
  <defs>
    <linearGradient id="tm-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="55%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#05050a"/>
    </linearGradient>
    <linearGradient id="tm-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="tm-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tm-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes tm-pulse {
        0%,100% { opacity: .35; transform: scaleX(.6); }
        50%     { opacity: 1;   transform: scaleX(1);  }
      }
      @keyframes tm-led {
        0%,100% { opacity: .25; }
        50%     { opacity: 1;   }
      }
      .tm-led      { transform-origin: 32px 50px; animation: tm-pulse 2.4s ease-in-out infinite; }
      .tm-dot      { animation: tm-led 1.6s ease-in-out infinite; transform-origin: center; }
      .tm-dot-2    { animation-delay: .4s; }
      .tm-dot-3    { animation-delay: .8s; }
    </style>
  </defs>

  <!-- soft outer halo -->
  <rect x="6" y="6" width="52" height="188" rx="6" fill="url(#tm-edge)" opacity="0.35" filter="url(#tm-glow)"/>

  <!-- main monolith body -->
  <rect x="10" y="10" width="44" height="180" rx="4" fill="url(#tm-body)" stroke="#6366f1" stroke-opacity="0.55" stroke-width="0.75"/>

  <!-- vertical sheen -->
  <rect x="10" y="10" width="44" height="180" rx="4" fill="url(#tm-sheen)"/>

  <!-- 4 segment dividers (3 separations -> 4 sections) -->
  <g stroke="#6366f1" stroke-opacity="0.45" stroke-width="0.6">
    <line x1="10" y1="55"  x2="54" y2="55"/>
    <line x1="10" y1="100" x2="54" y2="100"/>
    <line x1="10" y1="145" x2="54" y2="145"/>
  </g>
  <g stroke="#000" stroke-opacity="0.6" stroke-width="0.5">
    <line x1="10" y1="55.6"  x2="54" y2="55.6"/>
    <line x1="10" y1="100.6" x2="54" y2="100.6"/>
    <line x1="10" y1="145.6" x2="54" y2="145.6"/>
  </g>

  <!-- schematic LED line on the right (indicator rail) -->
  <line x1="48" y1="20" x2="48" y2="180" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="0.6"/>
  <g fill="#06b6d4">
    <circle class="tm-dot"        cx="48" cy="32"  r="1.2"/>
    <circle class="tm-dot tm-dot-2" cx="48" cy="77"  r="1.2"/>
    <circle class="tm-dot tm-dot-3" cx="48" cy="122" r="1.2"/>
    <circle class="tm-dot"        cx="48" cy="167" r="1.2"/>
  </g>

  <!-- second-section pulse bar (the "active" section) -->
  <g class="tm-led">
    <rect x="18" y="73" width="28" height="3" rx="1.5" fill="#8b5cf6"/>
    <rect x="18" y="73" width="28" height="3" rx="1.5" fill="#06b6d4" opacity="0.6" filter="url(#tm-glow)"/>
  </g>

  <!-- micro screen / readout marks per section -->
  <g fill="#ffffff" fill-opacity="0.7">
    <rect x="15" y="20" width="10" height="1" rx="0.5"/>
    <rect x="15" y="24" width="6"  height="1" rx="0.5"/>
    <rect x="15" y="110" width="8" height="1" rx="0.5"/>
    <rect x="15" y="155" width="12" height="1" rx="0.5"/>
    <rect x="15" y="159" width="5"  height="1" rx="0.5"/>
  </g>

  <!-- top + bottom caps -->
  <rect x="10" y="10" width="44" height="3" fill="#6366f1" fill-opacity="0.35"/>
  <rect x="10" y="187" width="44" height="3" fill="#06b6d4" fill-opacity="0.35"/>
</svg>
