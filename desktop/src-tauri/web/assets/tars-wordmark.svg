<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" role="img" aria-label="TARS">
  <title>TARS</title>
  <defs>
    <linearGradient id="tw-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="55%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#05050a"/>
    </linearGradient>
    <linearGradient id="tw-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="tw-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="tw-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tw-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes tw-pulse {
        0%,100% { opacity: .35; transform: scaleY(.55); }
        50%     { opacity: 1;   transform: scaleY(1);   }
      }
      @keyframes tw-led {
        0%,100% { opacity: .25; }
        50%     { opacity: 1;   }
      }
      .tw-led    { transform-origin: 28px 32px; animation: tw-pulse 2.4s ease-in-out infinite; }
      .tw-dot    { animation: tw-led 1.6s ease-in-out infinite; }
      .tw-dot-2  { animation-delay: .35s; }
      .tw-dot-3  { animation-delay: .7s;  }
      .tw-cursor { animation: tw-led 1s steps(2,end) infinite; }
    </style>
  </defs>

  <!-- ============ MONOLITH (compact mark, vertical, left side) ============ -->
  <g transform="translate(8,6)">
    <!-- halo -->
    <rect x="-2" y="-2" width="44" height="56" rx="5" fill="url(#tw-edge)" opacity="0.35" filter="url(#tw-glow)"/>
    <!-- body -->
    <rect x="0" y="0" width="40" height="52" rx="3" fill="url(#tw-body)" stroke="#6366f1" stroke-opacity="0.55" stroke-width="0.75"/>
    <!-- sheen -->
    <rect x="0" y="0" width="40" height="52" rx="3" fill="url(#tw-sheen)"/>

    <!-- 4 vertical sections (so monolith reads as 4 stacked panels) -->
    <g stroke="#6366f1" stroke-opacity="0.45" stroke-width="0.55">
      <line x1="0" y1="13" x2="40" y2="13"/>
      <line x1="0" y1="26" x2="40" y2="26"/>
      <line x1="0" y1="39" x2="40" y2="39"/>
    </g>
    <g stroke="#000" stroke-opacity="0.6" stroke-width="0.4">
      <line x1="0" y1="13.5" x2="40" y2="13.5"/>
      <line x1="0" y1="26.5" x2="40" y2="26.5"/>
      <line x1="0" y1="39.5" x2="40" y2="39.5"/>
    </g>

    <!-- right-side schematic LED rail -->
    <line x1="35" y1="4" x2="35" y2="48" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="0.55"/>
    <g fill="#06b6d4">
      <circle class="tw-dot"          cx="35" cy="8"  r="1"/>
      <circle class="tw-dot tw-dot-2" cx="35" cy="21" r="1"/>
      <circle class="tw-dot tw-dot-3" cx="35" cy="34" r="1"/>
      <circle class="tw-dot"          cx="35" cy="47" r="1"/>
    </g>

    <!-- active-section pulse bar (second segment) -->
    <g class="tw-led">
      <rect x="6" y="18" width="22" height="2.4" rx="1.2" fill="#8b5cf6"/>
      <rect x="6" y="18" width="22" height="2.4" rx="1.2" fill="#06b6d4" opacity="0.6" filter="url(#tw-glow)"/>
    </g>

    <!-- micro readout marks -->
    <g fill="#ffffff" fill-opacity="0.7">
      <rect x="4" y="4"  width="8" height="0.8" rx="0.4"/>
      <rect x="4" y="6"  width="4" height="0.8" rx="0.4"/>
      <rect x="4" y="30" width="6" height="0.8" rx="0.4"/>
      <rect x="4" y="44" width="9" height="0.8" rx="0.4"/>
    </g>

    <!-- top + bottom caps -->
    <rect x="0" y="0"  width="40" height="2" fill="#6366f1" fill-opacity="0.4"/>
    <rect x="0" y="50" width="40" height="2" fill="#06b6d4" fill-opacity="0.4"/>
  </g>

  <!-- ============ WORDMARK ============ -->
  <g transform="translate(64,0)">
    <!-- subtle schematic baseline -->
    <line x1="0" y1="46" x2="168" y2="46" stroke="#6366f1" stroke-opacity="0.25" stroke-width="0.5"/>
    <line x1="0" y1="46" x2="14"  y2="46" stroke="#06b6d4" stroke-opacity="0.8"  stroke-width="0.8"/>

    <!-- TARS text -->
    <text x="0" y="40"
          font-family="'SF Mono','JetBrains Mono','Menlo','Consolas',ui-monospace,monospace"
          font-size="32" font-weight="700"
          letter-spacing="6"
          fill="url(#tw-text)">TARS</text>

    <!-- tiny tagline -->
    <text x="1" y="56"
          font-family="'SF Mono','JetBrains Mono','Menlo','Consolas',ui-monospace,monospace"
          font-size="6" font-weight="500"
          letter-spacing="3"
          fill="#8b5cf6" fill-opacity="0.85">DESKTOP · CONTROL · CENTER</text>

    <!-- blinking cursor block -->
    <rect class="tw-cursor" x="124" y="18" width="4" height="22" fill="#06b6d4"/>
  </g>
</svg>
